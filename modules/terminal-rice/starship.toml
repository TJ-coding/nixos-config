format = "  $hostname $directory$line_break  $character"
right_format = "$custom $git_branch$git_status$cmd_duration"

add_newline = true

[hostname]
ssh_only = true
format = "[$hostname]($style)"
style = "bold Blue"

[directory]
format = " [$path]($style)"
style = "bold fg:245"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[$branch]($style)"
style = "fg:28"
symbol = ""

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "fg:166"

modified = "!"
staged = "+"
untracked = "?"
deleted = "✗"
renamed = "→"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
up_to_date = "✓"

[custom.netbird]
command = "netbird status --detail | sed -n 's/^FQDN: //p'"
when = "test -n \"$SSH_CONNECTION\" && command -v netbird >/dev/null 2>&1"
format = " [$output]($style)"
style = "blue"

[cmd_duration]
min_time = 1000
format = " [$duration]($style)"
style = "dimmed white"

[character]
success_symbol = "[❯](blue)"
error_symbol = "[❯](red)"