# Only the services actually used day-to-day (managed by Nix).
# Click-through links use the netbird hostname; status pings go via
# host.docker.internal (host bridge).

- Services:
    - Kohaku Hub:
        icon: sh-nginx
        href: http://nixos.netbird.cloud:28080
        description: Dataset registry (datasets, repos, files)
        widget:
          type: ping
          url: http://host.docker.internal:28080
    - lakeFS:
        icon: sh-archive
        href: http://nixos.netbird.cloud:28000
        description: Git-for-data (acl26-csr, WMT, …)
        widget:
          type: ping
          url: http://host.docker.internal:28000
    - RustFS Console:
        href: http://nixos.netbird.cloud:9001
        description: Object storage admin (S3 on /mnt/s3data)
        widget:
          type: ping
          url: http://host.docker.internal:9001