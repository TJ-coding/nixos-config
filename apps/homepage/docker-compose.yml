name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - /etc/homepage/config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Required since Homepage v1.0 when accessed from a non-localhost URL.
      # Comma-separated (no spaces) list of allowed Host headers.
      HOMEPAGE_ALLOWED_HOSTS: "nixos.netbird.cloud:8080,100.82.43.201:8080,localhost:8080,127.0.0.1:8080"