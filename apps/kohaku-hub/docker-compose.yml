services:

  # ============================================================
  # KohakuHub UI
  # ============================================================

  hub-ui:
    image: nginx:alpine
    container_name: hub-ui
    restart: always
    ports:
      - "28080:80"
    volumes:
      - ${KOHAKU_HUB_FRONTEND}/ui:/usr/share/nginx/html:ro
      - ${KOHAKU_HUB_SOURCE}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hub-api

  # ============================================================
  # KohakuHub API
  # ============================================================

  hub-api:
    build:
      context: ${KOHAKU_HUB_SOURCE}
    container_name: hub-api
    restart: always
    ports:
      - "48888:48888"

    depends_on:
      postgres:
        condition: service_started
      lakefs:
        condition: service_started
      valkey:
        condition: service_started

    environment:

      # Endpoint configuration
      KOHAKU_HUB_BASE_URL: ${KOHAKU_HUB_BASE_URL}
      KOHAKU_HUB_INTERNAL_BASE_URL: http://hub-api:48888
      KOHAKU_HUB_S3_PUBLIC_ENDPOINT: ${KOHAKU_HUB_S3_ENDPOINT}

      # Security
      KOHAKU_HUB_SESSION_SECRET: ${KOHAKU_HUB_SESSION_SECRET}
      KOHAKU_HUB_ADMIN_SECRET_TOKEN: ${KOHAKU_HUB_ADMIN_SECRET_TOKEN}
      KOHAKU_HUB_DATABASE_KEY: ${KOHAKU_HUB_DATABASE_KEY}

      # Performance
      KOHAKU_HUB_WORKERS: 4

      # Database
      KOHAKU_HUB_DB_BACKEND: postgres
      KOHAKU_HUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kohakuhub
      KOHAKU_HUB_AUTO_MIGRATE: "true"

      # S3
      KOHAKU_HUB_S3_ENDPOINT: ${KOHAKU_HUB_S3_ENDPOINT}
      KOHAKU_HUB_S3_ACCESS_KEY: ${KOHAKU_HUB_S3_ACCESS_KEY}
      KOHAKU_HUB_S3_SECRET_KEY: ${KOHAKU_HUB_S3_SECRET_KEY}
      KOHAKU_HUB_S3_BUCKET: kohaku-hub
      KOHAKU_HUB_S3_REGION: us-east-1
      KOHAKU_HUB_S3_SIGNATURE_VERSION: s3v4

      # LakeFS
      KOHAKU_HUB_LAKEFS_ENDPOINT: http://lakefs:28000
      KOHAKU_HUB_LAKEFS_REPO_NAMESPACE: hf
      KOHAKU_HUB_LAKEFS_ACCESS_KEY: ${LAKEFS_INSTALLATION_ACCESS_KEY_ID}
      KOHAKU_HUB_LAKEFS_SECRET_KEY: ${LAKEFS_INSTALLATION_SECRET_ACCESS_KEY}

      # Application
      KOHAKU_HUB_SITE_NAME: KohakuHub
      KOHAKU_HUB_LFS_THRESHOLD_BYTES: 1000000
      KOHAKU_HUB_LFS_MULTIPART_THRESHOLD_BYTES: 100000000
      KOHAKU_HUB_LFS_MULTIPART_CHUNK_SIZE_BYTES: 50000000
      KOHAKU_HUB_LFS_KEEP_VERSIONS: 5
      KOHAKU_HUB_LFS_AUTO_GC: "true"

      # Authentication
      KOHAKU_HUB_REQUIRE_EMAIL_VERIFICATION: "false"
      KOHAKU_HUB_INVITATION_ONLY: "false"
      KOHAKU_HUB_SESSION_EXPIRE_HOURS: 168
      KOHAKU_HUB_TOKEN_EXPIRE_DAYS: 365
      KOHAKU_HUB_ADMIN_ENABLED: "true"

      # SMTP
      KOHAKU_HUB_SMTP_ENABLED: "false"
      KOHAKU_HUB_SMTP_HOST: smtp.gmail.com
      KOHAKU_HUB_SMTP_PORT: 587
      KOHAKU_HUB_SMTP_USERNAME: ""
      KOHAKU_HUB_SMTP_PASSWORD: ""
      KOHAKU_HUB_SMTP_FROM: noreply@kohakuhub.local
      KOHAKU_HUB_SMTP_TLS: "true"

      # Storage quotas
      KOHAKU_HUB_DEFAULT_USER_PRIVATE_QUOTA_BYTES: 5497558138880
      KOHAKU_HUB_DEFAULT_USER_PUBLIC_QUOTA_BYTES: 5497558138880
      KOHAKU_HUB_DEFAULT_ORG_PRIVATE_QUOTA_BYTES: 5497558138880
      KOHAKU_HUB_DEFAULT_ORG_PUBLIC_QUOTA_BYTES: 5497558138880

      # Cache
      KOHAKU_HUB_CACHE_ENABLED: "true"
      KOHAKU_HUB_CACHE_URL: redis://valkey:6379/0

    extra_hosts:
      - "host.docker.internal:host-gateway"


  # ============================================================
  # LakeFS
  # ============================================================

  lakefs:
    build:
      context: ${KOHAKU_HUB_SOURCE}/docker/lakefs
    container_name: lakefs
    restart: always

    ports:
      - "28000:28000"

    environment:

      # LakeFS database
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_DATABASE_LOCAL_PATH: /var/lakefs/data/metadata.db

      # LakeFS blockstore
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: ${KOHAKU_HUB_S3_ENDPOINT}
      LAKEFS_BLOCKSTORE_S3_BUCKET: kohaku-hub
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${KOHAKU_HUB_S3_ACCESS_KEY}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${KOHAKU_HUB_S3_SECRET_KEY}
      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1

      # LakeFS encryption
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}

      # Initial lakeFS administrator
      LAKEFS_INSTALLATION_USER_NAME: ${LAKEFS_INSTALLATION_USER_NAME}
      LAKEFS_INSTALLATION_ACCESS_KEY_ID: ${LAKEFS_INSTALLATION_ACCESS_KEY_ID}
      LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: ${LAKEFS_INSTALLATION_SECRET_ACCESS_KEY}

      # General
      LAKEFS_LOGGING_FORMAT: text
      LAKEFS_LISTEN_ADDRESS: 0.0.0.0:28000

    volumes:
      - /var/lib/kohaku-hub/data/hub-meta/lakefs-data:/var/lakefs/data
      - /var/lib/kohaku-hub/data/hub-meta/lakefs-cache:/lakefs/data/cache

    extra_hosts:
      - "host.docker.internal:host-gateway"


  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kohakuhub

    ports:
      - "25432:5432"

    volumes:
      - /var/lib/kohaku-hub/data/hub-meta/postgres-data:/var/lib/postgresql/data


  # ============================================================
  # Valkey
  # ============================================================

  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: always

    command:
      - valkey-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lfu
      - --save
      - "300"
      - "100"
      - --appendonly
      - "no"

    volumes:
      - /var/lib/kohaku-hub/data/hub-meta/valkey-data:/data

    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5


# ==============================================================
# Network
# ==============================================================

networks:
  default:
    name: hub-net